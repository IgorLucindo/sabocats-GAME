<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sabocats</title>
  <link rel="icon" type="image/png" href="assets/textures/characters/blueCat/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/hints.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/roomPanel.css">
  <link rel="stylesheet" href="css/scoreboard.css">
  <link rel="stylesheet" href="css/winnerBanner.css">
  <link rel="stylesheet" href="css/mapMenu.css">
  <link rel="stylesheet" href="css/debug.css">
  <link rel="stylesheet" href="css/start.css">
  <link rel="stylesheet" href="css/rotate-overlay.css">
  <link rel="stylesheet" href="css/gamepad.css">
</head>

<body>
  <canvas class="canvas"></canvas>
  <div id="vignette"></div>
  <div id="divMenu"></div>
  <!-- Virtual gamepad (touch devices only — shown/hidden by GamepadSystem) -->
  <div id="gamepad-overlay">
    <div id="gamepad-joystick-area">
      <div id="gamepad-joystick-base">
        <div id="gamepad-joystick-stick"></div>
      </div>
    </div>
    <div id="gamepad-buttons-area">
      <div class="gamepad-btn" id="btn-rotate"><img src="assets/textures/keys/gamepad/rotate.png" draggable="false"></div>
      <div class="gamepad-btn" id="btn-select"><img src="assets/textures/keys/gamepad/select.png" draggable="false"></div>
      <div class="gamepad-btn" id="btn-jump"><img src="assets/textures/keys/gamepad/jump.png" draggable="false"></div>
      <div class="gamepad-btn" id="btn-close"><img src="assets/textures/keys/gamepad/close.png" draggable="false"></div>
    </div>
  </div>

  <div id="rotate-overlay">
    <div id="rotate-icon"></div>
    <div id="rotate-text">PLEASE ROTATE YOUR DEVICE</div>
  </div>

  <!-- GSAP library for animations -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"
    integrity="sha512-kVlGhj2qFy+KBCFuvjBJTGUMxbdqJKs4yK2jh0e0VPhWUPiPC87bzm4THmaaIee3Oj7j6sDpTTgm2EPPiESqBg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>

  <!-- Socket.IO for networking -->
  <script src="../socket.io/socket.io.js"></script>

  <!-- Main entry point -->
  <script type="module" src="src/index.js"></script>
</body>
</html>
